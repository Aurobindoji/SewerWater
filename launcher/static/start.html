<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PravaahForge - Sewer &amp; Water network design</title>
<style>
  /* the start page in the welcome video's look (user request 16-Nov-2026: continuity with the animation): the video's
     last frame is the backdrop - when the video ends it stays as it is, then slowly dims and blurs while the card
     rises in. Blue = Pravaah (flow, water), orange = Forge. Always this dark look; the theme (light / dark / system)
     is for the module pages and is still chosen here. */
  :root { --text: #e8f1ff; --muted: #9fb4cf; --cyan: #4fc8ff; --cyan2: #1e8fff; --amber: #ffb347; --amber2: #ff7a1a;
    --glass: rgba(6, 14, 30, .62); --edge: rgba(79, 200, 255, .32); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #00020a; color: var(--text);
    font: 16px/1.45 "Segoe UI", "Nirmala UI", system-ui, sans-serif; overflow: hidden; }
  #bg { position: fixed; inset: 0; background: #00020a url("/intro_end.jpg") center / contain no-repeat;
    filter: blur(7px) brightness(.38) saturate(1.15); transform: scale(1.05);
    transition: filter 1.1s ease, transform 1.4s ease; }
  #glow { position: fixed; inset: 0; pointer-events: none; transition: opacity 1.4s ease;
    background: radial-gradient(60% 50% at 32% 50%, rgba(30, 143, 255, .16), transparent 70%),
                radial-gradient(50% 45% at 72% 50%, rgba(255, 122, 26, .12), transparent 70%); }
  main { position: relative; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; padding: 30px 30px 26px;
    width: min(560px, 100%); text-align: center; backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(255, 179, 71, .08) inset, 0 18px 60px rgba(0, 0, 0, .55),
                0 0 40px rgba(30, 143, 255, .18); transition: opacity .8s ease .65s, transform .9s ease .65s; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 650; }
  h1.brand { font-size: 46px; line-height: 1.05; margin: 2px 0 6px; letter-spacing: .5px; font-weight: 800; }
  h1.brand .p { background: linear-gradient(180deg, #b9f0ff, var(--cyan) 45%, var(--cyan2)); -webkit-background-clip: text;
    background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(79, 200, 255, .55)); }
  h1.brand .f { background: linear-gradient(180deg, #ffe2a8, var(--amber) 45%, var(--amber2)); -webkit-background-clip: text;
    background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(255, 140, 40, .55)); }
  .logo { border-radius: 14px; margin-bottom: 8px; box-shadow: 0 0 18px rgba(79, 200, 255, .35), 0 0 30px rgba(255, 140, 40, .15); }
  .tag { color: #c9dcf5; font-size: 12.5px; letter-spacing: 2.6px; text-transform: uppercase; margin-bottom: 22px; }
  .pick, .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button.big { position: relative; padding: 20px 12px; border: 1px solid rgba(120, 170, 230, .25); border-radius: 14px;
    background: rgba(10, 22, 44, .7); color: var(--text); font: 600 21px/1.2 "Segoe UI", "Nirmala UI", sans-serif;
    cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .2s, background .2s; }
  button.big:hover, button.big:focus-visible { outline: none; transform: translateY(-2px); }
  button.big.c:hover, button.big.c:focus-visible { border-color: var(--cyan); background: rgba(14, 40, 70, .8);
    box-shadow: 0 0 0 1px var(--cyan) inset, 0 0 22px rgba(79, 200, 255, .45); }
  button.big.a:hover, button.big.a:focus-visible { border-color: var(--amber); background: rgba(50, 30, 12, .75);
    box-shadow: 0 0 0 1px var(--amber) inset, 0 0 22px rgba(255, 150, 50, .45); }
  button.big small { display: block; margin-top: 6px; font: 400 12.5px/1.3 "Segoe UI", "Nirmala UI", sans-serif; color: var(--muted); }
  button.big:disabled { opacity: .6; cursor: progress; transform: none; }
  .back { margin-top: 20px; background: none; border: none; color: var(--cyan); font: inherit; font-size: 14px; cursor: pointer; }
  .back:hover { text-shadow: 0 0 8px rgba(79, 200, 255, .7); }
  [hidden] { display: none !important; }
  /* the welcome video (user request 16-Nov-2026): the whole window, once when the app opens */
  #intro { position: fixed; inset: 0; z-index: 50; background: #00020a; display: flex; align-items: center;
    justify-content: center; transition: opacity .6s ease; cursor: pointer; }
  #intro.out { opacity: 0; pointer-events: none; }
  #intro video { width: 100%; height: 100%; object-fit: contain; }   /* the whole logo, any window shape - as #bg */
  #intro .skip { position: absolute; right: 18px; bottom: 14px; color: #ffffffb0; font-size: 13px;
    background: #0006; padding: 4px 10px; border-radius: 12px; }
  /* while the video plays: the backdrop sharp and bright (= the video's last frame), the card and the rest away */
  body.intro #bg { filter: none; transform: none; }
  body.intro #glow { opacity: 0; }
  body.intro .card { opacity: 0; transform: translateY(18px) scale(.98); }
  body.intro .foot, body.intro #theme { opacity: 0; }
  .foot { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted);
    transition: opacity 1s ease .6s; }
  .foot a { color: var(--muted); }
  .foot a:hover { color: var(--cyan); }
  #theme { position: fixed; top: 10px; right: 12px; padding: 4px 6px; border: 1px solid rgba(120, 170, 230, .3);
    border-radius: 8px; background: rgba(6, 14, 30, .7); color: var(--text); font: 13px "Segoe UI", "Nirmala UI", sans-serif;
    transition: opacity 1s ease .6s; }
  @media (prefers-reduced-motion: reduce) { #bg, .card, #glow, .foot, #theme { transition: none; } }
  @media (max-height: 560px) { h1.brand { font-size: 34px; } .card { padding: 20px; } }
</style>
</head>
<body>
<div id="bg"></div><div id="glow"></div>
<div id="intro" hidden><video id="introvid" muted playsinline preload="auto"></video><span class="skip">छोड़ें / Skip ›</span></div>
<main>
  <div class="card" id="step1">
    <img class="logo" src="/icon.png" alt="" width="60" height="60">
    <h1 class="brand"><span class="p">Pravaah</span><span class="f">Forge</span></h1>
    <div class="tag">Water &amp; Sewer network design</div>
    <div class="pick">भाषा चुनें / Choose language</div>
    <div class="choices">
      <button class="big c" data-lang="hi">हिन्दी</button>
      <button class="big a" data-lang="en">English</button>
    </div>
  </div>
  <div class="card" id="step2" hidden>
    <h1 class="brand" style="font-size:30px"><span class="p">Pravaah</span><span class="f">Forge</span></h1>
    <h1 id="t2"></h1>
    <div class="sub" id="s2"></div>
    <div class="choices">
      <button class="big c" id="water"></button>
      <button class="big a" id="sewer"></button>
    </div>
    <button class="back" id="back"></button>
  </div>
</main>
<select id="theme" title="रंग / Colours"><option value="system">🖥 System</option><option value="light">☀ Light</option>
  <option value="dark">🌙 Dark</option></select>
<div class="foot"><a href="#" id="about">About</a> <span id="ver"></span></div>
<script>
"use strict";
// the launcher's start page (user decision 10-Nov-2026): only the module chosen is started (launcher/server.py
// /api/open), in this same window; the other starts only from its button in a module's page
const TXT = {
  hi: { t2: "क्या डिज़ाइन करना है?", s2: "विषय चुनें", sewer: "सीवर<small>सीवर network - zoning, design, DPR</small>",
        water: "पेयजल<small>पेयजल network - zoning, design, DPR</small>", back: "← भाषा बदलें", about: "परिचय (About)" },
  en: { t2: "What would you like to design?", s2: "Choose the module", sewer: "Sewer<small>Sewer network - zoning, design, DPR</small>",
        water: "Water supply<small>Water network - zoning, design, DPR</small>", back: "← Change language", about: "About" },
};
let lang = "hi";
function step2(l) {
  lang = l;
  try { localStorage.setItem("sewer_app_lang", l); } catch (e) { }
  fetch("/api/ui?lang=" + l).catch(() => { });          // the desktop app's tray, menu and About in this language
  document.documentElement.lang = l;
  const t = TXT[l];
  document.getElementById("t2").textContent = t.t2;
  document.getElementById("s2").textContent = t.s2;
  document.getElementById("sewer").innerHTML = t.sewer;
  document.getElementById("water").innerHTML = t.water;
  document.getElementById("back").textContent = t.back;
  document.getElementById("about").textContent = t.about;
  document.getElementById("step1").hidden = true;
  document.getElementById("step2").hidden = false;
  document.getElementById("sewer").focus();
}
document.querySelectorAll("button[data-lang]").forEach(b => b.onclick = () => step2(b.dataset.lang));
async function openModule(name) {
  const st = document.getElementById("s2"), was = st.textContent;
  st.textContent = lang === "en" ? "Starting …" : "शुरू हो रहा है …";
  document.querySelectorAll("#step2 button").forEach(b => b.disabled = true);
  try {
    const r = await (await fetch("/api/open?module=" + name)).json();
    if (!r.ok) throw new Error(r.log || "error");
    if (window.pywebview && window.pywebview.api && window.pywebview.api.module_opened)
      await window.pywebview.api.module_opened(name);              // the desktop window: its title, its module
    location.href = r.url + "?lang=" + lang + "&intro=1";          // in this window, alone
  } catch (e) {
    st.textContent = was;
    document.querySelectorAll("#step2 button").forEach(b => b.disabled = false);
    alert((lang === "en" ? "Could not start: " : "शुरू नहीं हुआ: ") + e.message);
  }
}
// the theme, shared with the module pages (launcher/server.py /api/ui)
let theme = "system";
function applyTheme() {
  const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.getElementById("theme").value = theme;
}
fetch("/api/ui").then(r => r.json()).then(r => { theme = r.theme || "system"; applyTheme(); }).catch(() => applyTheme());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
document.getElementById("theme").onchange = e => { theme = e.target.value; applyTheme(); fetch("/api/ui?theme=" + theme).catch(() => { }); };
// About (10-Nov-2026): the desktop app's own window, else this page's tab
fetch("/api/version").then(r => r.json()).then(r => { document.getElementById("ver").textContent = "· v" + r.app_version; }).catch(() => { });
document.getElementById("about").onclick = e => {
  e.preventDefault();
  if (window.pywebview && window.pywebview.api && window.pywebview.api.show_about) window.pywebview.api.show_about();
  else location.href = "/about?lang=" + lang;
};
document.getElementById("sewer").onclick = () => openModule("sewer");
document.getElementById("water").onclick = () => openModule("water");
document.getElementById("back").onclick = () => {
  document.getElementById("step2").hidden = true; document.getElementById("step1").hidden = false;
};
// the welcome video: once a run of the app (not when coming back from a module, nor after a reload), silent; a
// click, a key or the end of the video goes to the page; no video (a page of its own in a browser too) - the page
{
  const q = new URLSearchParams(location.search), box = document.getElementById("intro"),
        vid = document.getElementById("introvid");
  let seen = false;
  try { seen = sessionStorage.getItem("pf_intro") === "1"; sessionStorage.setItem("pf_intro", "1"); } catch (e) { }
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!seen && !still && q.get("step") !== "module") {
    let done = false;
    // the handover: under the video the backdrop is its last frame, sharp (body.intro). At the end the video goes
    // at once (the same picture stays), then the backdrop dims / blurs and the card rises (CSS transitions). Skipped
    // early: the video fades over the same change.
    const end = () => {
      if (done) return;
      done = true;
      const atEnd = vid.ended || (vid.duration && vid.currentTime >= vid.duration - 0.15);
      if (atEnd) box.remove(); else { box.classList.add("out"); setTimeout(() => box.remove(), 650); }
      requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("intro")));
      document.removeEventListener("keydown", end);
      setTimeout(() => {
        const b = document.querySelector("#step1:not([hidden]) button, #step2:not([hidden]) button");
        if (b) b.focus();
      }, 900);
    };
    document.body.classList.add("intro");
    box.hidden = false;
    vid.src = "/intro.mp4";
    vid.onended = end; vid.onerror = end; box.onclick = end;
    document.addEventListener("keydown", end);
    setTimeout(end, 9000);                                  // whatever happens, the page after 9 s
    const p = vid.play();
    if (p && p.catch) p.catch(end);
  } else box.remove();
}
// back from a module page (/?lang=en&step=module): straight to the choice of module
{
  const q = new URLSearchParams(location.search);
  if (q.get("step") === "module" && (q.get("lang") === "hi" || q.get("lang") === "en")) step2(q.get("lang"));
}
</script>
</body>
</html>
