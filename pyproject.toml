[project]
name = "sewer_app"
version = "0.9.7"
description = "Gravity sewer and water supply network design to CPHEEO rules, without SewerGEMS / WaterGEMS"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["openpyxl", "ezdxf", "matplotlib", "numpy", "scipy", "pyproj"]

[project.optional-dependencies]
desktop = ["pywebview>=6"]          # app.py / desktop.bat: the map UI in a window of its own

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120                      # the width the code is written to (not enforced: E501 is not selected)
extend-exclude = ["build", "dist", "output", "projects"]

[tool.ruff.lint]
# real mistakes only: undefined / unused names, syntax errors, statements with no effect (.venv\Scripts\ruff check)
select = ["F", "E9", "PLE", "B018"]
